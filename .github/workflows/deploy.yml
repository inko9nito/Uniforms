name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the live site from Airtable a few times a day so availability
    # and prices stay current without a manual push.
    - cron: '0 */6 * * *'

# Needs write access to push the built site to the gh-pages branch.
permissions:
  contents: write

# Don't let two production deploys race each other.
concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Pull the latest inventory from Airtable into
      # src/data/inventory.generated.json and download its photos. The token
      # lives only in Actions secrets, so it never reaches the browser bundle.
      - name: Sync inventory from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/fetch-airtable.mjs

      - run: npm run build

      # Publish the production build to the ROOT of the gh-pages branch.
      # clean: true removes stale production files, but clean-exclude keeps
      # the pr-preview/ directory so open PR previews survive a deploy.
      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
